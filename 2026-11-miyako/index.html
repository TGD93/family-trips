<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>宮古島</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="宮古島">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7fd0ef">
<script>(function(){var r=document.documentElement,m=matchMedia("(prefers-color-scheme: dark)");r.setAttribute("data-theme","light");r.classList.toggle("cdark",m.matches);})();</script>
<style>
:root{--card:rgba(255,255,255,.88);--ink:#123a48;--mute:#4f7381;--line:rgba(18,58,72,.18);--btn:#0f7f95;--btnink:#fff;--err:#b23a2e}
html.cdark{--card:rgba(10,32,44,.92);--ink:#e3f3f7;--mute:#9cc0cb;--line:rgba(227,243,247,.22);--btn:#3cc0d3;--btnink:#05202a;--err:#ff8f80}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#147f99}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);
background:linear-gradient(180deg,#7fd0ef 0%,#a6e2f3 40%,#3fbfcd 41%,#147f99 100%) fixed}
.lk{width:100%;max-width:360px;background:var(--card);border-radius:22px;padding:28px 22px 22px;text-align:center;box-shadow:0 18px 40px rgba(0,30,45,.25)}
.ic{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 14px;box-shadow:0 6px 16px rgba(0,30,45,.25)}
h1{font-size:22px;margin:0 0 18px;letter-spacing:.04em}
form{display:grid;gap:12px;text-align:left}
label[for=pw]{font-size:14px;color:var(--mute)}
input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);letter-spacing:.06em}
input[type=password]:focus{outline:2px solid var(--btn);outline-offset:1px}
.rm{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.rm input{width:18px;height:18px;accent-color:var(--btn)}
button{font:inherit;font-weight:700;font-size:17px;padding:12px;border:0;border-radius:12px;background:var(--btn);color:var(--btnink);cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:1.5em;margin:0;font-size:14px;color:var(--err);text-align:center}
.wait{color:var(--mute);margin:0}
.up{display:inline-block;margin-top:14px;font-size:13px;color:var(--mute)}
[hidden]{display:none!important}
</style></head>
<body>
<main class="lk">
  <img class="ic" src="apple-touch-icon.png" alt="">
  <h1>宮古島</h1>
  <p class="wait" id="wait">載入中…</p>
  <form id="f" hidden autocomplete="on">
    <input type="text" name="username" value="family-trips" autocomplete="username" hidden>
    <label for="pw">輸入家族密碼</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
    <label class="rm"><input type="checkbox" id="rm" checked> 記住這台裝置</label>
    <button id="go">打開</button>
    <p id="msg" role="status"></p>
  </form>
  <a class="up" href="../">所有旅程</a>
</main>
<script>
(function(){
  var KEY='family-trips-key', ITER=600000;
  var $=function(s){ return document.getElementById(s); };
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function(){}); }
  var binP = fetch('app.bin',{cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error('net'); return r.arrayBuffer(); });
  function unb64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function b64(buf){ var u=new Uint8Array(buf), s=''; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
  function parts(buf){ var u=new Uint8Array(buf); if(u[0]!==77||u[1]!==75||u[2]!==49) throw new Error('fmt'); return {gz:u[3]&1, salt:u.slice(4,20), iv:u.slice(20,32), ct:u.slice(32)}; }
  function derive(pw, salt){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
    });
  }
  function decrypt(key, p){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:p.iv}, key, p.ct).then(function(pt){
      if(!p.gz) return new TextDecoder().decode(pt);
      if(typeof DecompressionStream==='undefined') throw new Error('old');
      return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    });
  }
  function show(html){ document.open(); document.write(html); document.close(); }
  function ask(t){ $('wait').hidden=true; $('f').hidden=false; $('msg').textContent=t||''; $('go').disabled=false; setTimeout(function(){ try{ $('pw').focus(); }catch(e){} }, 50); }
  function fail(e){
    if(e && e.message==='net') return ask('連不上網站，請確認網路後重新整理');
    if(e && e.message==='old') return ask('這個瀏覽器版本太舊，請更新後再開');
    ask('密碼不對，再試一次');
  }
  var saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved){
    binP.then(function(buf){ var p=parts(buf);
      return crypto.subtle.importKey('raw', unb64(saved), {name:'AES-GCM'}, false, ['decrypt']).then(function(k){ return decrypt(k, p); });
    }).then(show, function(e){ if(e && e.message==='net') return fail(e); try{ localStorage.removeItem(KEY); }catch(x){} ask(''); });
  } else { binP.then(function(){ ask(''); }, fail); }
  $('f').addEventListener('submit', function(ev){
    ev.preventDefault(); var pw=$('pw').value.trim(); if(!pw) return;
    $('go').disabled=true; $('msg').textContent='';
    var key;
    binP.then(function(buf){ var p=parts(buf);
      return derive(pw, p.salt).then(function(k){ key=k; return decrypt(k, p); });
    }).then(function(html){
      if($('rm').checked){ return crypto.subtle.exportKey('raw', key).then(function(raw){ try{ localStorage.setItem(KEY, b64(raw)); }catch(e){} return html; }); }
      return html;
    }).then(show, fail);
  });
})();
</script>
</body></html>
